name: QA Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  lint-android:
    name: Android Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android Lint
        run: ./gradlew lint

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for secrets in code
        run: |
          echo "Scanning for hardcoded secrets..."
          FOUND=0
          for pattern in "api[_-]?key" "secret" "password" "token" "private[_-]?key"; do
            MATCHES=$(grep -rnI --include="*.java" --include="*.xml" --include="*.gradle" --include="*.properties" -iE "$pattern\s*[:=]" . | grep -v "gradlew" | grep -v ".gradle/" || true)
            if [ -n "$MATCHES" ]; then
              echo "⚠️ Possible secrets found for pattern '$pattern':"
              echo "$MATCHES"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            echo "::warning::Possible hardcoded secrets detected — review above matches"
          else
            echo "✅ No hardcoded secrets found"
          fi

  commit-lint:
    name: Commit Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Check commit messages
        run: |
          echo "Checking commit message format..."
          ERRORS=0
          for sha in $(git log --format=%H -10 2>/dev/null); do
            MSG=$(git log --format=%s -1 $sha)
            if ! echo "$MSG" | grep -qE "^(feat|fix|docs|style|refactor|test|chore|ci|build|perf|revert)(\(.+\))?: .+"; then
              echo "⚠️ Non-conventional: $MSG"
            fi
          done
          echo "✅ Commit lint complete (advisory)"
